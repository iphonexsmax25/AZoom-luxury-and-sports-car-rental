<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Welcome back | AZoom</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="../../shared/css/style.css">
        <link rel="stylesheet" href="../../shared/css/account.css">
    </head>
    <body class="authpage" data-page="login">
        <div class="authbox">
            <a class="back" href="../home/home.html"><span data-ic="back"></span> Back to home</a>
            <div class="acard">
                <img class="alogo" src="../../images/azoom-logo.png" alt="AZoom: Luxury &amp; Sports Car Rental">
                <h1>Welcome back</h1>
                <p class="sub">Sign in to manage your bookings</p>
                <form id="authform">
                    <div class="fld">
                        <label for="email"><span data-ic="mail"></span> Email</label
                        ><input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required>
                    </div>
                    <div class="fld">
                        <label for="pw"><span data-ic="lock"></span> Password</label
                        ><input
                            id="pw"
                            name="password"
                            type="password"
                            placeholder="Your password"
                            autocomplete="current-password"
                            required>
                    </div>
                    <p class="err" id="err" role="alert"></p>
                    <button class="btn red" type="submit">Sign In</button>
                </form>
                <p class="switch">Don't have an account? <a href="../signup/signup.html">Sign Up</a></p>
            </div>
        </div>
        <script src="../../shared/js/auth.js"></script>
        <script src="../../shared/js/account.js"></script>
    </body>
</html>
