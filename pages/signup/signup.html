<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Create account | AZoom</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="../../shared/css/style.css">
        <link rel="stylesheet" href="../../shared/css/account.css">
    </head>
    <body class="authpage" data-page="signup">
        <div class="authbox">
            <a class="back" href="../home/home.html"><span data-ic="back"></span> Back to home</a>
            <div class="acard">
                <img class="alogo" src="../../images/azoom-logo.png" alt="AZoom: Luxury &amp; Sports Car Rental">
                <h1>Create account</h1>
                <p class="sub">Join AZoom and start driving legends</p>
                <form id="authform">
                    <div class="two">
                        <div class="fld">
                            <label for="fn"><span data-ic="user"></span> First Name</label
                            ><input
                                id="fn"
                                name="first"
                                placeholder="e.g. Aisha"
                                autocomplete="given-name"
                                maxlength="40"
                                required>
                        </div>
                        <div class="fld">
                            <label for="ln"><span data-ic="user"></span> Last Name</label
                            ><input
                                id="ln"
                                name="last"
                                placeholder="e.g. Tan"
                                autocomplete="family-name"
                                maxlength="40"
                                required>
                        </div>
                    </div>
                    <div class="fld">
                        <label for="email"><span data-ic="mail"></span> Email</label
                        ><input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required>
                    </div>
                    <div class="fld">
                        <label for="pw"><span data-ic="lock"></span> Password</label
                        ><input
                            id="pw"
                            name="password"
                            type="password"
                            placeholder="8+ characters with upper &amp; lower case"
                            autocomplete="new-password"
                            required
                            minlength="8">
                    </div>
                    <div class="fld">
                        <label for="pw2"><span data-ic="lock"></span> Confirm password</label
                        ><input
                            id="pw2"
                            name="confirm"
                            type="password"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required>
                    </div>
                    <div class="perks">
                        <span>Instant booking</span><span>Booking history</span><span>Exclusive deals</span>
                    </div>
                    <p class="hint" style="margin:0 0 10px">
                        By creating an account you agree to our
                        <a href="../terms/terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and
                        consent to the use of your personal data as described in our
                        <a href="../privacy/privacy.html" target="_blank" rel="noopener">Privacy Policy</a> (PDPA).
                    </p>
                    <p class="err" id="err" role="alert"></p>
                    <button class="btn red" type="submit">Create Account</button>
                </form>
                <p class="switch">Already have an account? <a href="../login/login.html">Sign In</a></p>
            </div>
        </div>
        <script src="../../shared/js/auth.js"></script>
        <script src="../../shared/js/account.js"></script>
    </body>
</html>
